repos:
  - repo: local
    hooks:
      - id: hello
        name: Say Hello
        entry: powershell.exe -NoProfile -Command "Write-Output 'Hello! Pre-commit is running.'; Add-Type -AssemblyName PresentationFramework; [System.Windows.MessageBox]::Show('Hello! Pre-commit is running.', 'Git Pre-commit')"
        language: system
        pass_filenames: false